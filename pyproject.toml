[project]
name = "enterprise-knowledge-management"
version = "0.1.0"
description = "An enterprise knowledge assistant that routes questions to internal documents or web search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
   "agent-trace-sdk",
   "chromadb>=1.3.7",
   "langchain>=0.3.27",
   "langchain-cohere>=0.4.6",
   "langchain-community>=0.3.31",
   "langchain-tavily>=0.2.11",
   "langgraph>=0.6.7",
   "pypdf>=6.5.0",
   "python-dotenv>=1.1.1",
]

[tool.uv.sources]
agent-trace-sdk = { git = "https://github.com/thefalc/agent-trace-sdk", rev = "5acba2d" }

[dependency-groups]
dashboard = [
    "altair>=6.3.0",
    "pandas>=3.0.6",
    "streamlit>=1.65.0",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]